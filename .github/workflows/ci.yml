name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: R round-trip test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          # Rclade 声明 ggtree >= 4.0.0，而 ggtree 4.x 只随 Bioconductor 3.19+
          # 发布（对应 R >= 4.4）。R 4.3 配 Bioc 3.18 只能拿到 ggtree 3.10.x，
          # 会在 lazy loading 阶段报 "namespace 'ggtree' 3.10.1 is being
          # loaded, but >= 4.0.0 is required"。
          r-version: '4.5'
          use-public-rspm: true

      - name: Install system libs
        # ggtree / deeptime 的绘图链路会 dlopen X11 与字体栈动态库。
        # runner 用 ubuntu 而非 macos-latest：测试本身无平台依赖（已核对
        # test_roundtrip.R 不含任何 macOS 专有调用），而 macos-latest 的
        # 队列远慢于 ubuntu，且其内置 X11 已废弃、不含 libXrender。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrender1 libxtst6 \
            libfreetype6-dev libjpeg-dev libpng-dev libtiff5-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev libicu-dev
          echo "--- headers present ---"
          # curl.h 装在 multiarch 路径下（/usr/include/x86_64-linux-gnu/curl），
          # 只查 /usr/include/curl/curl.h 会误报 MISSING，故按文件名全局查找。
          for h in jpeglib.h png.h Xlib.h curl.h; do
            if find /usr/include -name "$h" -print -quit 2>/dev/null | grep -q .; then
              echo "  ok      $h  ($(find /usr/include -name "$h" -print -quit))"
            else
              echo "  MISSING $h"
            fi
          done

      - name: Install R dependencies
        # 本仓库无 DESCRIPTION（纯脚本项目），依赖通过 CRAN/Bioconductor 安装：
        # Rclade 会带入 ape / ggtree / deeptime 等绘图与时间轴依赖。
        # 显式走 `Rscript -e` 而非 `shell: Rscript`——后者在 macOS runner 上
        # 不会被识别（"Invalid shell option"），需 runner 侧预注册。
        # 每步单独一个 Rscript 进程：R 的 install.packages 在同一进程内连续
        # 调用时，前一次失败会被后续的 quietly 掩盖，导致包实际没装上。
        run: |
          set -euo pipefail
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install("ggtree", ask=FALSE, update=FALSE)'
          Rscript -e 'install.packages("Rclade", repos="https://cloud.r-project.org")'
          Rscript -e 'ip <- rownames(installed.packages()); cat("installed:", length(ip), "\n"); cat("has Rclade:", "Rclade" %in% ip, "\n")'

      - name: Verify Rclade is importable
        run: |
          Rscript -e 'suppressMessages(library(Rclade)); cat("Rclade", as.character(packageVersion("Rclade")), "OK\n")'

      - name: Round-trip test
        run: Rscript tests/test_roundtrip.R
