name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: R round-trip test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install system deps
        run: |
          brew install --quiet libgit2 openssl@3 2>/dev/null || true

      - name: Install R deps
        run: |
          install.packages(c("remotes", "jsonlite"), quiet = TRUE)
          remotes::install_deps(dependencies = TRUE, upgrade = "never", quiet = TRUE)

      - name: Round-trip test
        run: Rscript tests/test_roundtrip.R
