name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: R round-trip test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install system deps
        run: |
          brew install --quiet libgit2 openssl@3 2>/dev/null || true

      - name: Install R dependencies
        # 本仓库无 DESCRIPTION（纯脚本项目），依赖通过 CRAN/Bioconductor 安装：
        # Rclade 会带入 ape / ggtree / deeptime 等绘图与时间轴依赖。
        shell: Rscript
        run: |
          install.packages("BiocManager", quiet = TRUE)
          BiocManager::install("ggtree", ask = FALSE, update = FALSE)
          install.packages("Rclade", repos = c(CRAN = "https://cloud.r-project.org"))

      - name: Verify Rclade is importable
        shell: Rscript
        run: 'suppressMessages(library(Rclade)); cat("Rclade", as.character(packageVersion("Rclade")), "OK\n")'

      - name: Round-trip test
        run: Rscript tests/test_roundtrip.R
